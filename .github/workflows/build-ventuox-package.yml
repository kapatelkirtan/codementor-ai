name: Build Ventuox upload package

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-ventuox-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build static website for Ventuox
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest CodeMentor AI
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate standard-size PWA install icons
        run: |
          convert client/public/favicon.png -strip -resize 192x192! client/public/icon-192.png
          convert client/public/favicon.png -strip -resize 512x512! client/public/icon-512.png
          test "$(identify -format '%wx%h' client/public/icon-192.png)" = "192x192"
          test "$(identify -format '%wx%h' client/public/icon-512.png)" = "512x512"

      - name: Install locked dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web

      - name: Verify complete website package
        run: |
          test -f client/dist/index.html
          test -f client/dist/index.php
          test -f client/dist/manifest.webmanifest
          test -f client/dist/sw.js
          test -f client/dist/favicon.png
          test -f client/dist/icon-192.png
          test -f client/dist/icon-512.png
          python -m json.tool client/dist/manifest.webmanifest > /dev/null
          grep -q '"src": "icon-192.png"' client/dist/manifest.webmanifest
          grep -q '"src": "icon-512.png"' client/dist/manifest.webmanifest
          test -f client/dist/VENTUOX-UPLOAD-README.txt
          test -n "$(find client/dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          test -n "$(find client/dist/assets -maxdepth 1 -name '*.css' -print -quit)"

      - name: Upload ready-to-deploy website files
        uses: actions/upload-artifact@v4
        with:
          name: codementor-ai-ventuox-upload
          path: client/dist/
          if-no-files-found: error
          retention-days: 7
