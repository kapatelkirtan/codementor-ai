name: Export CodeMentor AI before tip wording change

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-pre-tip-version.yml"

permissions:
  contents: read

jobs:
  export:
    name: Package exact pre-tip-change revision
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo

      - name: Create release folder and full source ZIP
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"
          git -C repo archive --format=zip --output="$GITHUB_WORKSPACE/release/codementor-ai-source-before-tip-change.zip" 8ba6cac0f007e16736c39e30443d69ad57e10862

      - name: Check out the exact older project revision
        uses: actions/checkout@v4
        with:
          ref: 8ba6cac0f007e16736c39e30443d69ad57e10862
          path: snapshot

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snapshot/package-lock.json

      - name: Build the old website
        working-directory: snapshot
        run: |
          npm ci
          npm run build:web

      - name: Create the ready-to-upload website ZIP
        shell: bash
        run: |
          test -f snapshot/client/dist/index.html
          test -n "$(find snapshot/client/dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          grep -R -F "Tip : download this website as app from edge browser for lockscreen background music play...." snapshot/client/dist/assets/*.js
          cd snapshot/client/dist
          zip -qr "$GITHUB_WORKSPACE/release/codementor-ai-website-before-tip-change.zip" .

      - name: Upload both ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: codementor-ai-before-tip-change
          path: release/
          if-no-files-found: error
          retention-days: 7
